# A Bolt-compatible graph database on your own machine.
#
#   docker compose up -d
#
# Then put these three lines in .env.local and run `npm run db:seed`:
#
#   NEO4J_URI=bolt://localhost:7687
#   NEO4J_USERNAME=neo4j
#   NEO4J_PASSWORD=understory-local
#
# The application does not know or care which database it is talking to — that
# is the point of speaking Bolt and openCypher rather than a vendor SDK. Use
# this for offline development, or as a fallback if the demo instance is having
# a bad day.

services:
  graph:
    image: neo4j:5.26-community
    container_name: understory-graph
    ports:
      - '7687:7687' # Bolt
      - '7474:7474' # Browser, http://localhost:7474
    environment:
      NEO4J_AUTH: neo4j/understory-local
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - graph-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  graph-data:
